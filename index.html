<!-- ===================== CHECKPOINT 1 =====================
     Saved snapshot of a known-good working state.
     Posts area (top-left 3/4): 2-column layout, color-tinted names,
       assigned-team card with Team Name Buttons (Posted/?/X/C) + Call
       Button area (R/L/O/T/A + timestamp + expandable call-notes popout).
     Teams area (right 1/4, single column, 16 slots): P/?/X/C 2x2 grid,
       location + status + timestamp.
     Setup dialog: right side popup with live preview, add/move/dup/delete,
       20-swatch color picker, half/full spacers with weighted column math.
     If a later change breaks something, this comment marks the point to
     revert to (see aftershock-checkpoint1.html saved alongside this file).
     ===================== END CHECKPOINT 1 ===================== -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aftershock Posting Board</title>
<style>
:root{
  --bg:#14171C; --panel:#1C2028; --panel2:#20242C; --border:#2A2F3A;
  --text:#E8EAED; --muted:#8B93A1; --armed:#3D6EC9; --bad:#C24545;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;}
body{display:flex;flex-direction:column;}
header{flex:0 0 auto;padding:5px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:nowrap;overflow-x:auto;
  padding-top:calc(5px + env(safe-area-inset-top,0px));}
.hleft{display:flex;align-items:center;gap:8px;min-width:0;flex-shrink:1;}
.hright{flex-shrink:0;}
header h1{font-size:15px;font-weight:600;margin:0;flex-shrink:0;white-space:nowrap;}
.editsgroup{display:flex;align-items:center;gap:8px;border:1px solid var(--armed);border-radius:6px;padding:2px 6px;background:#161c2b;}
.editsbtns{display:flex;flex-direction:column;gap:2px;}
.editsrecent{display:flex;flex-direction:column;gap:1px;min-width:170px;}
.erecent{font-size:8px;line-height:1.05;color:var(--muted);white-space:nowrap;}
.erecent:first-child{color:var(--text);}
.hright{display:flex;align-items:center;gap:8px;}
.clock{font-size:13px;color:var(--text);}
.editswrap{position:relative;}
.editspop{display:none;position:absolute;top:100%;right:0;margin-top:6px;background:#0f1116;
  border:1px solid var(--border);border-radius:6px;padding:8px;width:280px;max-height:none;z-index:50;font-size:11px;}
.editspop.open{display:block;}
.editspop .erow{padding:3px 0;border-bottom:1px solid var(--border);color:var(--muted);}
.editspop .erow:last-child{border-bottom:none;}
.editsmore{background:none;border:none;color:var(--armed);font-size:10.5px;cursor:pointer;padding:4px 0 0;text-decoration:underline;}
#callLogTable{width:100%;border-collapse:collapse;font-size:11px;}
#callLogTable th,#callLogTable td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:top;}
#callLogTable th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);}
.btn{background:var(--panel);border:1px solid var(--border);color:var(--text);
  padding:7px 12px;border-radius:6px;font-size:12.5px;cursor:pointer;}
.btn:hover{border-color:#3a4150;}
.btn.small{padding:4px 8px;font-size:11.5px;}
.stage{position:relative;flex:1 1 auto;min-height:0;}
.posts-area{position:absolute;top:12px;left:12px;width:calc(75% - 18px);height:calc(75% - 18px);
  background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;
  display:flex;flex-direction:column;min-height:0;}
.teams-area{position:absolute;top:12px;right:12px;width:calc(25% - 18px);height:calc(75% - 18px);
  background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;
  display:flex;flex-direction:column;min-height:0;}
.createcall-area{position:absolute;top:calc(75% + 6px);right:12px;width:calc(25% - 18px);height:calc(25% - 18px);
  background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px;
  display:flex;flex-direction:column;min-height:0;}
.extras-area{position:absolute;top:calc(75% + 6px);left:12px;width:calc(75% - 18px);height:calc(25% - 18px);
  background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;
  display:flex;gap:10px;min-height:0;}
.extras-col{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;}
.cols{flex:1 1 auto;min-height:0;display:flex;gap:14px;}
.col{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;}

/* mini buttons shared */
.pbtn{width:11px;height:11px;border-radius:3px;border:1px solid var(--border);background:#12151a;color:var(--muted);
  font-size:6.5px;font-weight:700;cursor:pointer;flex-shrink:0;padding:0;line-height:1;}
.pbtn.armed{background:var(--armed);border-color:var(--armed);color:#fff;}
.flagbtn{width:16px;height:12px;border-radius:3px;border:1px solid var(--border);background:#12151a;color:var(--muted);
  font-size:7px;font-weight:700;cursor:pointer;flex-shrink:0;padding:0;line-height:1;}
.flagbtn.active{background:var(--bad);border-color:var(--bad);color:#fff;}
.clearbtn{width:16px;height:12px;border-radius:3px;border:1px solid var(--border);background:#12151a;color:var(--muted);
  font-size:7px;font-weight:700;cursor:pointer;flex-shrink:0;padding:0;line-height:1;}
.clearbtn.active{background:#E8384F;border-color:#E8384F;color:#fff;}
.oosbtn{width:16px;height:12px;border-radius:3px;border:1px solid var(--border);background:#12151a;color:var(--muted);
  font-size:7px;font-weight:700;cursor:pointer;flex-shrink:0;padding:0;line-height:1;}
.oosbtn.active{background:#B8B8B8;border-color:#B8B8B8;color:#1a1a1a;}
.pgrid{display:grid;grid-template-columns:repeat(2,11px);grid-template-rows:repeat(2,11px);gap:2px;flex-shrink:0;}
.namewrap.clearon{background:#3d3a1a;}
.namewrap.ooson{background:#2c2c2c;}
.stopwatch{font-size:9px;font-weight:700;color:var(--text);flex-shrink:0;margin-left:auto;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;white-space:nowrap;}
.dangertxt{color:var(--bad)!important;}
.statusbtn{width:18px;height:12px;border-radius:3px;border:1px solid var(--border);background:#12151a;color:var(--muted);
  font-size:6.5px;font-weight:700;cursor:pointer;flex-shrink:0;padding:0;line-height:1;}
.statusbtn.active{color:#0d1015;font-weight:700;border-color:transparent;}
.statusbadge{font-size:8.5px;font-weight:700;padding:1px 5px;border-radius:8px;color:#0d1015;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.3);flex-shrink:0;}

/* ---------- POSTS (main board) ---------- */
.prow{display:flex;align-items:stretch;border-bottom:1px solid var(--border);flex:0 0 calc(100%/12);min-height:0;min-width:0;}
.prow:last-child{border-bottom:none;}
.prow.spacer-half{flex:0 0 calc(100%/24);border-bottom:none;}
.prow.spacer-full{flex:0 0 calc(100%/12);border-bottom:none;}
.pname{flex:0 0 30%;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:3px 4px;min-width:0;border-radius:3px;position:relative;}
.pname-top{display:flex;align-items:center;gap:5px;min-width:0;}
.pname .label{overflow:hidden;white-space:nowrap;font-size:12.5px;line-height:1.1;}
.pdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.setteambtn{width:64px;height:15px;border-radius:3px;border:1px solid var(--border);background:#12151a;
  color:var(--muted);font-size:9px;font-weight:700;cursor:pointer;padding:0;}
.setteambtn:disabled{opacity:.35;cursor:not-allowed;}
.setteambtn.armed{background:var(--armed);border-color:var(--armed);color:#fff;}
.pteam{flex:1;display:flex;align-items:stretch;padding:0;border-left:1px solid var(--border);
  color:var(--muted);font-size:10px;font-style:italic;min-width:0;}
.assignedwrap{flex:1;display:flex;align-items:stretch;gap:6px;padding:0 6px 2px;border-radius:3px;min-width:0;}
.pt-name{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;}
.pt-name .tlabel{color:var(--text);font-style:normal;font-weight:700;font-size:14px;overflow:hidden;white-space:nowrap;}
.vstack3{display:flex;flex-direction:column;gap:2px;}
.pt-col2{flex:0 0 auto;display:flex;align-items:stretch;}
.postedbtn{width:44px;height:12px;border-radius:3px;border:1px solid var(--border);
  background:#12151a;color:var(--muted);font-size:6.5px;font-weight:700;cursor:pointer;padding:0;}
.postedbtn.vertical{width:13px;height:auto;writing-mode:vertical-rl;text-orientation:upright;
  letter-spacing:0.5px;font-size:6px;padding:2px 0;}
.postedbtn.active{background:#3D7A5C;color:#0d1015;border-color:transparent;}
.tnrow3{display:flex;gap:2px;}
.pt-col3{flex:1;display:flex;flex-direction:column;min-width:0;padding:1px 0;}
.callbtnsrow{flex:0 0 33%;display:flex;align-items:stretch;gap:2px;min-width:0;}
.numpostcol{flex:0 0 auto;width:68px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;align-self:stretch;padding-top:4px;}
.numpostcol > *{flex:0 0 auto;}
.numpostcol .tlabel{color:var(--text);font-weight:700;font-size:21px;line-height:.9;white-space:nowrap;font-style:normal;flex:0 0 auto;display:block;text-align:center;width:100%;margin-top:0;}
.postactionbtn{width:100%;height:14px;border-radius:3px;border:1px solid var(--border);background:#12151a;font-size:9px;
  color:var(--muted);font-weight:700;cursor:pointer;padding:0;}
.postactionbtn.active{background:#4CAF6E;color:#0d1015;border-color:transparent;}
.vstack{display:flex;flex-direction:column;gap:1px;align-self:stretch;flex-shrink:0;position:relative;}
.vstack>button{flex:1;width:20px;height:auto;min-height:0;}
.vgrid2x2{display:grid;grid-template-columns:repeat(2,22px);grid-template-rows:repeat(2,1fr);gap:2px;flex-shrink:0;align-self:stretch;}
.vgrid2x2 button{width:100%;height:100%;min-height:0;font-size:9px;}
.secondbtn{width:20px;height:15px;border-radius:3px;border:1px solid var(--border);background:#12151a;color:var(--muted);
  font-size:9px;font-weight:700;cursor:pointer;flex-shrink:0;padding:0;line-height:1;}
.secondbtn.active{background:var(--armed);border-color:var(--armed);color:#fff;}
.setteampop{display:none;position:absolute;z-index:45;background:#0f1116;border:1px solid var(--border);
  border-radius:6px;padding:10px;gap:12px;width:400px;top:100%;left:0;margin-top:4px;}
.setteampop.open{display:flex;}
.secondpop-old-unused{display:none;position:absolute;z-index:45;background:#0f1116;border:1px solid var(--border);
  border-radius:6px;padding:6px;gap:6px;width:280px;top:100%;left:0;margin-top:4px;}
.secondpop.open{display:flex;}
.sp-col{flex:1;min-width:120px;}
.sp-head{font-size:9.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;}
.sp-row{font-size:12px;padding:7px 8px;border-radius:3px;cursor:pointer;color:var(--text);white-space:nowrap;}
.sp-row:hover{background:#20242C;}
.sp-empty{font-size:10px;color:var(--muted);font-style:italic;padding:3px 4px;}
.notesboxwrap{flex:1;position:relative;min-width:0;display:flex;}
.pt-col3 .notesboxwrap{margin-top:2px;}
.notesbox-ta{display:block;flex:1;min-width:0;height:auto;resize:none;overflow:hidden;cursor:pointer;white-space:pre-wrap;
  background:#12151a;border:1px solid var(--border);border-radius:3px;color:var(--text);
  padding:2px 4px;line-height:1.2;font-family:inherit;font-style:normal;text-align:left;}
.notespop{display:none;position:absolute;top:100%;left:0;margin-top:2px;z-index:40;background:#0f1116;
  border:1px solid var(--border);border-radius:6px;padding:5px;width:190px;}
.notespop.open{display:block;}
.notespop textarea{width:100%;height:64px;background:#171a20;border:1px solid var(--border);color:var(--text);
  font-size:10px;padding:4px;border-radius:4px;resize:none;font-style:normal;}
.statusbtns{display:flex;gap:1px;flex:1;min-width:0;}
.statusbtns .statusbtn{flex:1;width:auto;height:auto;min-width:0;font-size:9px;padding:0;}

/* ---------- TEAMS (main board) ---------- */
.trow{display:flex;align-items:stretch;border-bottom:1px solid var(--border);flex:1 1 0;min-height:0;min-width:0;}
.trow:last-child{border-bottom:none;}
.trow.spacer-half{flex:0.5 1 0;border-bottom:none;}
.trow.spacer-full{flex:1 1 0;border-bottom:none;}
.tname{flex:0 0 40%;display:flex;align-items:center;gap:4px;padding:4px 6px;min-width:0;}
.tname .label{font-size:12.5px;font-weight:600;overflow:hidden;white-space:nowrap;}
.tmorewrap{flex:1;border-left:1px solid var(--border);display:flex;flex-direction:column;padding:3px 6px;min-width:0;}
.tmore-top{flex:0 0 15px;display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;}
.tmore-bottom{flex:1;display:flex;align-items:stretch;gap:6px;min-width:0;padding-top:2px;position:relative;}
.breakbtn{width:14px;height:11px;border-radius:3px;border:1px solid var(--border);background:#12151a;
  color:var(--muted);font-size:6.5px;font-weight:700;cursor:pointer;flex-shrink:0;padding:0;line-height:1;}
.breakbtn.active{background:#F2D94E;border-color:#F2D94E;color:#1a1a1a;}
.teamnotesbox{flex:1;background:#12151a;border:1px solid var(--border);color:var(--text);font-size:9px;
  padding:2px 4px;border-radius:3px;resize:none;min-width:0;}
.tmore-top .loc{font-size:9.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}

/* ---------- SETUP DIALOG (layout editing only) ---------- */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
  padding:14px;width:1000px;max-width:96vw;height:92vh;}
dialog[open]{display:flex;flex-direction:column;}
dialog::backdrop{background:rgba(0,0,0,.5);}
dialog h3{margin:0 0 8px;font-size:14px;flex:0 0 auto;}
dialog h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);flex:0 0 auto;}
.dlgbody{flex:1 1 auto;overflow:hidden;min-height:0;display:flex;gap:12px;}
.dlggrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:3fr 2fr;gap:10px;}
.dlg-section{display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid var(--border);border-radius:6px;padding:8px;}
.dlg-cols{display:flex;gap:8px;flex:1;min-height:0;overflow-y:auto;}
.dlg-col{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;}
.dlg-row{display:flex;align-items:stretch;border-bottom:1px solid var(--border);position:relative;flex:1 1 0;min-height:22px;}
.dlg-namewrap{flex:1;display:flex;flex-direction:column;min-width:0;justify-content:center;}
.dlg-row:last-child{border-bottom:none;}
.dlg-row.spacer-half{flex:0.5 1 0;background:repeating-linear-gradient(45deg,#1a1e25,#1a1e25 4px,transparent 4px,transparent 8px);}
.dlg-row.spacer-full{background:repeating-linear-gradient(45deg,#1a1e25,#1a1e25 4px,transparent 4px,transparent 8px);}
.dlg-name{flex:1;display:flex;align-items:center;gap:5px;padding:2px 5px;min-width:0;}
.dlg-name .label{font-size:11px;overflow:hidden;white-space:nowrap;flex:1;}
.dlg-name input.editname{width:100%;background:#12151a;border:1px solid var(--armed);color:var(--text);font-size:11px;padding:1px 3px;border-radius:3px;}
.dlg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;cursor:pointer;}
.dlg-ctl{display:flex;gap:2px;align-items:center;flex-shrink:0;}
.iconbtn{background:#171a20;border:1px solid var(--border);color:var(--text);width:17px;height:17px;
  border-radius:3px;cursor:pointer;font-size:8.5px;flex-shrink:0;line-height:1;padding:0;}
.iconbtn:hover{border-color:var(--armed);}
.iconbtn:disabled{opacity:.3;cursor:default;}
.addrow{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0;}
.addrow input[type=text]{flex:1 1 100px;background:#171a20;border:1px solid var(--border);color:var(--text);
  padding:5px 7px;border-radius:5px;font-size:12px;min-width:0;}

.swatchpop{display:none;position:absolute;top:18px;left:2px;background:#0f1116;border:1px solid var(--border);
  border-radius:6px;padding:5px;grid-template-columns:repeat(5,16px);gap:4px;z-index:40;}
.swatchpop.open{display:grid;}
.swatch{width:16px;height:16px;border-radius:4px;cursor:pointer;border:1px solid rgba(255,255,255,.15);}
.nextpostbtn{color:#E0A855;border-color:#5a4322;}
.nextdisp{width:100%;min-height:19px;display:flex;align-items:center;gap:3px;}
.nextdisp .nextarrow{color:#E8912D;font-size:9px;flex-shrink:0;line-height:1;}
.nextdisp .nextname{flex:1;min-width:0;overflow:visible;white-space:normal;word-break:break-word;line-height:1.05;color:#F0C98A;font-size:12px;font-weight:800;font-style:normal;}
.nextdisp .nextname.occupied{color:#8FE0A8;}
.nextbtnstack{display:flex;flex-direction:column;gap:1px;flex-shrink:0;}
.nextdisp button{width:16px;height:12px;padding:0;border-radius:3px;border:1px solid var(--border);background:#12151a;font-size:8px;line-height:1;cursor:pointer;flex-shrink:0;}
.nextdisp .nextok{color:#7CD98A;}
.nextdisp .nextx{color:#E8384F;}
.nextpop{position:absolute;z-index:60;top:100%;left:0;margin-top:3px;background:#0f1116;border:1px solid var(--border);
  border-radius:6px;padding:9px;width:max-content;font-style:normal;font-size:1.08em;}
.nextpop-cols{display:flex;gap:10px;}
.nextbreak{width:100%;margin-top:7px;padding:5px;border-radius:4px;border:1px solid #6b5a1a;background:#3d3410;color:#F2D94E;font-size:10px;font-weight:700;cursor:pointer;}
.nextpop .sp-col{min-width:165px;}
.nextpop .sp-row{color:var(--text);}
.nextpop .sp-row.pk{display:flex;align-items:baseline;gap:5px;white-space:nowrap;}
.nextpop .pk .pn{color:var(--muted);font-weight:400;font-size:1em;}
.nextpop .pk .pk-dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;vertical-align:middle;}
.nextpop .pk .who{color:#9fc4ff;font-weight:700;font-size:10.5px;font-style:italic;margin-left:5px;}
.nextpop .pk .who .stcolor,.stcolor{font-style:normal;font-weight:800;font-size:9px;padding:1px 4px;border-radius:3px;margin-left:3px;color:#0d1015;display:inline-block;}
.nextpop .pk .nx{color:#E8912D;font-size:10.5px;margin-left:5px;}
.nextpop .pk.open .pn{color:#fff;font-weight:800;}
.nextpop .pk.free .pn{color:#fff;font-weight:800;}
.nextpop .pk.here .pn{color:var(--text);font-weight:400;}
.nextpop .pk .star{color:#F2D94E;margin-right:3px;font-size:13px;}
.nextpop .pk.occ .pn{color:var(--text);}
.nextpop .pk.taken{opacity:.5;cursor:default;}
.nextpop .pk.taken:hover{background:none;}
.setteampop .sp-row.unposted{font-weight:800;color:#fff;}
.btn.danger{color:#ffb3b3;}
.btn.confirming{background:#C24545;border-color:#C24545;color:#fff;font-weight:700;}
.pk-space{height:6px;width:100%;}
.pk-space.full{height:11px;}
.postactionbtn.posted-look{background:#4CAF6E;color:#0d1015;border-color:transparent;}
.pname-bottom{display:flex;align-items:center;gap:4px;}
.nextdisp.small{width:auto;flex:1;min-width:0;height:19px;}
.nextdisp.small .nextname{font-size:11px;font-weight:700;}
.urow{flex:1 1 0;display:flex;flex-direction:column;border-bottom:1px solid var(--border);padding:3px 4px;min-height:0;gap:2px;}
.urow.spacer-half{flex:0.5 1 0;border-bottom:none;}
.urow.spacer-full{flex:1 1 0;border-bottom:none;}
.urow:last-child{border-bottom:none;}
.rrow{flex:1 1 0;display:flex;flex-direction:column;border-bottom:1px solid var(--border);padding:2px 4px;min-height:0;gap:1px;}
.rrow.spacer-half{flex:0.5 1 0;border-bottom:none;}
.rrow.spacer-full{flex:1 1 0;border-bottom:none;}
.rrow:last-child{border-bottom:none;}
.simple-top{display:flex;align-items:center;justify-content:space-between;gap:4px;}
.simple-name{font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.urow .simple-name{font-size:12px;}
.rrow .simple-name{font-size:10.5px;}
.ava-pair{display:flex;gap:3px;flex-shrink:0;}
.avabtn,.nabtn{border-radius:3px;border:1px solid var(--border);background:#12151a;color:var(--muted);
  font-weight:700;cursor:pointer;padding:0;}
.urow .avabtn,.urow .nabtn{width:30px;height:15px;font-size:8px;}
.rrow .avabtn,.rrow .nabtn{width:26px;height:13px;font-size:7px;}
.avabtn.active{background:#4CAF6E;border-color:#4CAF6E;color:#0d1015;}
.nabtn.active{background:#8a3d3d;border-color:#8a3d3d;color:#fff;}
.simple-notes{flex:1;min-height:0;display:flex;}

<body>
<header>
  <div class="hleft">
    <h1>Aftershock</h1>
    <button class="btn danger" id="resetBtn" title="Un-post everyone, clear statuses and notes">Reset</button>
    <button class="btn" id="resetStatusBtn" title="Keep everyone at their post, reset status to Posted, clear notes, release all 2nds">Reset Status</button>
    <div class="editsgroup">
      <div class="editsbtns">
        <button class="btn small" id="undoBtn" disabled>Undo</button>
        <button class="btn small" id="redoBtn" disabled>Redo</button>
      </div>
      <div class="editsrecent" id="editsRecent"></div>
      <div class="editswrap">
        <button class="btn small" id="editsToggle" title="More edits">&#9662;</button>
        <div class="editspop" id="editsPop"></div>
      </div>
    </div>
  </div>
  <div class="settimes-header" id="setTimesHeader"></div>
  <div class="hright">
    <button class="btn" id="setupBtn">Setup</button>
    <button class="btn" id="callLogBtn">Call Log</button>
    <div class="recentcalls-mini" id="recentCallsMini"></div>
    <span class="clockstack">
      <span class="clock mono" id="clock">--:--:--</span>
      <span class="hcounter mono" id="confirmedCount" title="Confirmed calls">Conf: 0</span>
      <span class="hcounter mono" id="nextRunDisplay" title="Next run number">Next Run: 100</span>
    </span>
  </div>
</header>

<dialog id="callLogDialog">
  <h3>Call Log</h3>
  <div class="dlgbody" style="flex-direction:column;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <button class="btn small" id="callLogResetBtn">Clear All</button>
      <span class="hcounter mono" id="confirmedCountDialog" style="color:var(--text);font-size:12px;">Confirmed Calls: 0</span>
    </div>
    <table id="callLogTable"><thead><tr><th></th><th>Run#</th><th>Post</th><th>Team</th><th>2nd Team</th><th>Started</th><th>Ended</th><th>Stages</th><th>Notes</th><th>Resolution</th></tr></thead><tbody id="callLogBody"></tbody></table>
  </div>
  <button class="btn" id="closeCallLog" style="width:100%;margin-top:10px;">Close</button>
</dialog>

<div class="stage">
  <div class="posts-area">
    <div class="cols" id="postsCols"></div>
  </div>
  <div class="teams-area">
    <div class="cols" id="teamsCols"></div>
  </div>
  <div class="createcall-area">
    <div id="callDraftsCol"></div>
  </div>
  <div class="extras-area">
    <div class="extras-col">
      <div class="cols" id="unitsCols"></div>
    </div>
    <div class="extras-col">
      <div class="cols" id="resourcesCols"></div>
    </div>
  </div>
</div>

<dialog id="setupDialog">
  <h3>Setup</h3>
  <div class="dlgbody dlggrid">
    <div class="dlg-section">
      <h4>Posts</h4>
      <div class="dlg-cols" id="dlgPostsCols"><div class="dlg-col"></div><div class="dlg-col"></div></div>
      <div class="addrow">
        <input type="text" id="newPostName" placeholder="New post">
        <button class="btn small" id="addPostBtn">Add Post</button>
        <button class="btn small" id="addPostHalfBtn">+Half</button>
        <button class="btn small" id="addPostFullBtn">+Full</button>
      </div>
    </div>
    <div class="dlg-section">
      <h4>Teams (max 16)</h4>
      <div class="dlg-cols" id="dlgTeamsCols"><div class="dlg-col"></div></div>
      <div class="addrow">
        <input type="text" id="newTeamName" placeholder="New team #">
        <button class="btn small" id="addTeamBtn">Add Team</button>
        <button class="btn small" id="addTeamHalfBtn">+Half</button>
        <button class="btn small" id="addTeamFullBtn">+Full</button>
      </div>
    </div>
    <div class="dlg-section">
      <h4>Other Units</h4>
      <div class="dlg-cols" id="dlgUnitsCols"><div class="dlg-col"></div><div class="dlg-col"></div></div>
      <div class="addrow">
        <input type="text" id="newUnitName" placeholder="New unit name">
        <button class="btn small" id="addUnitBtn">Add</button>
        <button class="btn small" id="addUnitHalfBtn">+Half</button>
        <button class="btn small" id="addUnitFullBtn">+Full</button>
      </div>
    </div>
    <div class="dlg-section">
      <h4>Transport Resources</h4>
      <div class="dlg-cols" id="dlgResourcesCols"><div class="dlg-col"></div><div class="dlg-col"></div></div>
      <div class="addrow">
        <input type="text" id="newResourceName" placeholder="New resource name">

<script>
/* =========================================================================
   SHARED — spacing / columns / swatches / text-fit / status config
   ========================================================================= */
const SWATCHES = ['#3D7A5C','#4A6FA5','#C9A227','#C24545','#8A5FC2','#2E9E9E','#B5533C','#5C8A3D',
                   '#9E4F8C','#3D5A80','#A67C3D','#4F7942','#7A3D5C','#3D8A7A','#6B4F9E','#D9C74A',
                   '#E08A3C','#6FA8DC','#E05C5C','#8B93A1'];
const STAGES = [
  {key:'R', label:'R', color:'#D9C74A'},
  {key:'L', label:'L', color:'#B3DBF7'},
  {key:'O', label:'OS', color:'#FF2222'},
  {key:'T', label:'TR', color:'#9B5FE0'},
  {key:'A', label:'MM', color:'#FF9500'}
];
const STATUS_COLORS = { P:'#4CAF6E', C:'#E8384F', OOS:'#B8B8B8', BRK:'#F2D94E', AVA:'#4CAF6E', USE:'#4A6FA5', NA:'#8a3d3d' };
function stageColor(key){
  const s = STAGES.find(x=>x.key===key);
  if(s) return s.color;
  if(STATUS_COLORS[key]) return STATUS_COLORS[key];
  return '#3D7A5C';
}

function itemWeight(it){ return it.type==='half' ? 0.5 : 1; }
function splitByCapacity(items, numCols, perColCapacity){
  const cols = Array.from({length:numCols}, ()=>[]);
  let colIdx = 0, used = 0;
  items.forEach(it=>{
    const w = itemWeight(it);
    if(used + w > perColCapacity + 0.0001 && colIdx < numCols-1){ colIdx++; used = 0; }
    cols[colIdx].push(it);
    used += w;
  });
  return cols;
}
function fitText(el){
  if(!el) return;
  let size = 12.5;
  el.style.fontSize = size+'px';
  let guard = 0;
  while(el.scrollWidth > el.clientWidth && size > 7.5 && guard++ < 20){
    size -= 0.5; el.style.fontSize = size+'px';
  }
}
function findItem(kind, id){ return arrFor(kind).find(x=>x.id===id); }
function arrFor(kind){
  if(kind==='post') return state.posts;
  if(kind==='unit') return state.otherUnits;
  if(kind==='resource') return state.transportResources;
  return state.teams;
}
function parseCompound(s){
  if(typeof s==='string' && s.includes(':')){ const i=s.indexOf(':'); return {kind:s.slice(0,i), id:s.slice(i+1)}; }
  return {kind:'team', id:s};
}
function moveIndex(kind, id, dir){
  const arr = arrFor(kind);
  const idx = arr.findIndex(p=>p.id===id);
  const newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = tmp;
  commit(`Reordered ${kind}`);
}
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.dlg-dot,.swatchpop')){
    document.querySelectorAll('.swatchpop.open').forEach(s=>s.classList.remove('open'));
  }
});

/* =========================================================================
   STATE / PERSISTENCE
   ========================================================================= */
const LS_KEY = "aftershock_board_reset5";
function seed(){
  const stages = ['Stage 1','Stage 2','Stage 3','Stage 4'];
  const roles = ['SL','SR','FOH','Mixer'];
  const posts = [];
  stages.forEach(stage=> roles.forEach(role=>{
    posts.push({ id: crypto.randomUUID(), type:'post', name: `${stage} ${role}`, color:null, sub:'' });
  }));
  const teamNums = [341,342,343,344,345,346,347,348,349,351];
  const teams = teamNums.map(n=>({ id: crypto.randomUUID(), type:'team', name:String(n), color:null, postId:null, status:null, statusSince:null, danger:false, notes:'', teamNotes:'', nextPostId:null, secondaries:[], secondaryOf:null, nextIsBreak:false, callTally:0, runNotes:'', extraRuns:[], nextNote:'' }));
  const otherUnits = ['Supervisor 1','Supervisor 2','Logistics 1','Logistics 2','RM 1','RM 2','RM 3','RM 4']
    .map(name=>({ id: crypto.randomUUID(), type:'unit', name, color:null, postId:null, status:null, statusSince:null, danger:false, notes:'', secondaryOf:null }));
  const transportResources = [1,2,3,4,5].map(n=>({ id: crypto.randomUUID(), type:'resource', name:`Wheelchair ${n}`, color:null, status:null, statusSince:null, danger:false, notes:'', secondaryOf:null }))
    .concat([1,2,3,4,5].map(n=>({ id: crypto.randomUUID(), type:'resource', name:`Gurney ${n}`, color:null, status:null, statusSince:null, danger:false, notes:'', secondaryOf:null })));
  return { posts, teams, otherUnits, transportResources };
}
function load(){ try{ const r = localStorage.getItem(LS_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
let state = load() || seed();
state.posts.forEach(p=>{ if(!p.type) p.type='post'; if(p.sub===undefined) p.sub=''; });
state.teams.forEach(t=>{
  if(!t.type) t.type='team';
  if(t.postId===undefined) t.postId=null;
  if(t.status===undefined) t.status=null;
  if(t.statusSince===undefined) t.statusSince=null;
  if(t.notes===undefined) t.notes='';
  if(t.teamNotes===undefined) t.teamNotes='';
  if(t.nextPostId===undefined) t.nextPostId=null;
  if(!Array.isArray(t.secondaries)) t.secondaries=[];
  if(t.secondaryOf===undefined) t.secondaryOf=null;
  if(t.nextIsBreak===undefined) t.nextIsBreak=false;
  if(t.nextNote===undefined) t.nextNote='';
  if(t.callTally===undefined) t.callTally=0;
  if(t.runNotes===undefined) t.runNotes='';
  if(!Array.isArray(t.extraRuns)) t.extraRuns=[];
  if(t.danger===undefined) t.danger=false;
});
if(!state.otherUnits) state.otherUnits = [];
if(!state.transportResources) state.transportResources = [];
state.otherUnits.forEach(u=>{
  if(!u.type) u.type='unit';
  if(u.color===undefined) u.color=null;
  if(u.postId===undefined) u.postId=null;
  if(u.status===undefined) u.status=null;
  if(u.statusSince===undefined) u.statusSince=null;
  if(u.danger===undefined) u.danger=false;
  if(u.notes===undefined) u.notes='';
  if(u.secondaryOf===undefined) u.secondaryOf=null;
  if(u.runNotes===undefined) u.runNotes='';
  if(!Array.isArray(u.extraRuns)) u.extraRuns=[];
});
state.transportResources.forEach(r=>{
  if(!r.type) r.type='resource';
  if(r.color===undefined) r.color=null;
  if(r.status===undefined) r.status=null;
  if(r.statusSince===undefined) r.statusSince=null;
  if(r.danger===undefined) r.danger=false;
  if(r.notes===undefined) r.notes='';
  if(r.secondaryOf===undefined) r.secondaryOf=null;
});
if(!state.callLog) state.callLog = [];
if(!state.nextRunNumber) state.nextRunNumber = 100;
if(!state.setTimes) state.setTimes = [0,1,2].map(()=>({ name:'', rows: [0,1,2,3,4].map(()=>({artist:'', start:'', end:''})) }));
function allocateRunNumber(){ const n = state.nextRunNumber; state.nextRunNumber++; return n; }
if(!Array.isArray(state.callDrafts) || state.callDrafts.length!==3) state.callDrafts = [{text:''},{text:''},{text:''}];
let callArmedIndex = null; // which of the 3 call drafts is being assigned
let armedTeamId = null; // "P" armed from a Team row -> click a post name to assign
let armedPostId = null; // "P" armed from a Post row -> click a team name to assign

/* =========================================================================
   UNDO / REDO — snapshot-based, drives the Recent Edits popout
   ========================================================================= */
let undoStack = [], redoStack = [];
let lastSnapshot = JSON.parse(JSON.stringify(state));
function nowLabel(){ return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}); }
function commit(label){
  undoStack.unshift({label, time: nowLabel(), snapshot: lastSnapshot});
  undoStack = undoStack.slice(0, 25);
  redoStack = [];
  lastSnapshot = JSON.parse(JSON.stringify(state));
  save();
  renderBoard();
  const dlg = document.getElementById('setupDialog');
  if(dlg && dlg.open) renderDialog();
  renderEditsPanel();
}
function doUndo(){
  if(!undoStack.length) return;
  const entry = undoStack.shift();
  redoStack.unshift({label: entry.label, time: nowLabel(), snapshot: JSON.parse(JSON.stringify(state))});
  redoStack = redoStack.slice(0, 25);
  state = entry.snapshot;
  lastSnapshot = JSON.parse(JSON.stringify(state));
  save(); renderBoard();
  const dlg = document.getElementById('setupDialog');
  if(dlg && dlg.open) renderDialog();
  renderEditsPanel();
}
function doRedo(){
  if(!redoStack.length) return;
  const entry = redoStack.shift();
  undoStack.unshift({label: entry.label, time: nowLabel(), snapshot: JSON.parse(JSON.stringify(state))});
  state = entry.snapshot;
  lastSnapshot = JSON.parse(JSON.stringify(state));
  save(); renderBoard();
  const dlg = document.getElementById('setupDialog');
  if(dlg && dlg.open) renderDialog();
  renderEditsPanel();
}
document.addEventListener('keydown', (e)=>{
  if(!(e.metaKey || e.ctrlKey)) return;
  if(e.key.toLowerCase()!=='z') return;
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='textarea') return;
  e.preventDefault();
  if(e.shiftKey) doRedo(); else doUndo();
});

/* =========================================================================
   POSTS — main-board rendering (operational: P-arm + status + assignment)
   ========================================================================= */
function postById(id){ return state.posts.find(p=>p.id===id && p.type==='post'); }
function teamAtPost(postId){ return state.teams.find(t=>t.type==='team' && t.postId===postId) || state.otherUnits.find(u=>u.postId===postId); }

function actionGridHTML(team, showArm){
  const armBtn = showArm
    ? `<button class="pbtn ${armedTeamId===team.id?'armed':''}" data-teamarm="${team.id}" title="Make active, then click a post">P</button>`
    : `<span></span>`;
  return `<span class="pgrid">
    ${armBtn}

    <button class="clearbtn ${team.status==='C'?'active':''}" data-clearbtn="${team.id}" title="Clear / needs a post">C</button>
  </span>`;
}
function flagsRowHTML(team){
  return `<span class="pgrid" style="grid-template-columns:repeat(3,14px);grid-template-rows:14px;">
    <button class="flagbtn ${team.danger?'active':''}" data-flagbtn="${team.id}" title="Flag / check in">?</button>
    <button class="oosbtn ${team.status==='OOS'?'active':''}" data-oosbtn="${team.id}" title="Out of service">X</button>
    <button class="clearbtn ${team.status==='C'?'active':''}" data-clearbtn="${team.id}" title="Clear / needs a post">C</button>
  </span>`;
}
function statusBtnsHTML(team){
  const cid = team.type==='team' ? team.id : (team.type+':'+team.id);
  return `<span class="statusbtns">${STAGES.filter(s=>s.key!=='L').map(s=>
    `<button class="statusbtn ${team.status===s.key?'active':''}" style="${team.status===s.key?`background:${s.color};`:''}" data-statusbtn="${cid}" data-stage="${s.key}">${s.label}</button>`
  ).join('')}</span>`;
}
let secondPopFor = null;
let pendingReassign = null;
let pendingSwap = null;
function doSwap(ownerCompound, kind, id){
  const {kind:ownerKind, id:ownerId} = parseCompound(ownerCompound);
  const owner = findItem(ownerKind, ownerId);
  const other = findItem(kind, id);
  if(!owner || !other) return;
  const idx = owner.secondaries.findIndex(s=>s.kind===kind && s.id===id);
  if(idx<0) return;
  // other takes over the call
  other.postId = owner.postId;
  other.status = owner.status;
  other.statusSince = owner.statusSince;
  other.callSession = owner.callSession;
  other.notes = owner.notes;
  other.runNotes = owner.runNotes;
  other.danger = owner.danger;
  other.secondaryOf = null;
  other.secondaries = owner.secondaries.filter((s,i)=>i!==idx);
  // other's notes now carry the transferred call notes; un-highlight the old "2nd: other" tag, note the swap, add a fresh highlighted tag for the demoted original
  resolveTag(other, other, kind);
  other.notes = (other.notes||'') + `${other.notes?' ':''}Swap: ${other.name}, ${owner.name}`;
  appendToLastLine(other, `2nd: ${owner.name}`);
  // owner becomes the new 2nd on the same call, loses their post
  owner.postId = null;
  owner.status = ownerKind==='team' ? 'R' : 'NA';
  owner.statusSince = Date.now();
  owner.callSession = null;
  owner.notes = '';
  owner.runNotes = '';
  owner.secondaries = [];
  const otherCid = kind==='team' ? other.id : kind+':'+other.id;
  owner.secondaryOf = otherCid;
  other.secondaries.push({kind: ownerKind, id: owner.id, notes:''});
  pendingSwap = null;
  commit(`Swapped: ${other.name} now original, ${owner.name} now 2nd`);
}
let tallyPopFor = null;
let notesOpenFor = null;
function teamLabel(t){
  const p = t.postId ? postById(t.postId) : null;
  const loc = p ? p.name : (t.status || 'unposted');
  return `${t.name} — ${loc}`;
}
function setTeamPopoverHTML(postId){
  const teams = state.teams.filter(t=>t.type==='team');
  const allCol = teams.map(t=>`<div class="sp-row ${t.postId?'':'unposted'} ${t.status==='C'?'clear-highlight':''}" data-quickassign="${t.id}" data-quickpost="${postId}">${teamLabel(t)}</div>`).join('') || '<div class="sp-empty">none</div>';
  return `<div class="setteampop open">
    <div class="sp-col"><div class="sp-head">All Teams</div>${allCol}</div>
  </div>`;
}
function appendToLastLine(team, snippet){
  const tag = `; ${snippet}; `;
  const lines = team.notes ? team.notes.split('\n') : [''];
  let anchor = lines.length-1;
  while(anchor>0 && /^Patient \d+$/.test(lines[anchor].trim())) anchor--;
  lines[anchor] = lines[anchor] + tag;
  team.notes = lines.join('\n');
}
function removeOnTag(item){
  item.notes = (item.notes||'').replace(/(2nd|TR) on: [^\n]*/, '').replace(/\n{2,}/g,'\n').trim();
}
function appendOnTag(item, ownerName, kind){
  const label = kind==='resource' ? 'TR' : '2nd';
  const tag = `${label} on: ${ownerName}`;
  const lines = item.notes ? item.notes.split('\n') : [''];
  lines[lines.length-1] = lines[lines.length-1] + (lines[lines.length-1] ? ' ' : '') + tag;
  item.notes = lines.join('\n');
}
function resolveTag(team, other, kind){
  const label = kind==='resource' ? 'TR' : '2nd';
  const esc = other ? other.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') : '';
  const re = new RegExp(`; (${label}: ${esc}[^;]*); `, 'g');
  team.notes = (team.notes||'').replace(re, (m, inner)=> inner + ' ');
}
function toggleSecondary(ownerCompound, kind, id){
  const {kind:ownerKind, id:ownerId} = parseCompound(ownerCompound);
  const team = findItem(ownerKind, ownerId); // "team" kept as the var name for minimal diff; may be a team OR a unit acting as call owner
  const ownerCid = ownerKind==='team' ? team.id : ownerKind+':'+team.id;
  if(!Array.isArray(team.secondaries)) team.secondaries = [];
  const idx = team.secondaries.findIndex(s=>s.kind===kind && s.id===id);
  const other = findItem(kind, id);
  if(idx>=0){
    team.secondaries.splice(idx,1);
    resolveTag(team, other, kind);
    if(other){
      if(kind==='unit'){ other.status='AVA'; other.statusSince=Date.now(); other.secondaryOf=null; removeOnTag(other); }
      else if(kind==='resource'){ other.secondaryOf=null; removeOnTag(other); /* stays N/A until manually changed */ }
      else if(kind==='team'){ other.secondaryOf = null; other.notes = ''; other.status = other.postId ? 'P' : 'C'; other.statusSince = Date.now(); }
    }
    commit(`${team.name} 2nd: ${other?other.name:''} removed`);
  } else {
    if(kind==='team' && (!other || isCallStage(other.status) || other.secondaryOf)) return; // not already on a call, not already a 2nd
    team.secondaries.push({kind, id, notes:''});
    const t = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
    if(other && (kind==='unit' || kind==='resource')){ other.status = 'NA'; other.statusSince = Date.now(); other.secondaryOf = ownerCid; appendOnTag(other, team.name, kind); }
    if(other && kind==='team'){
      other.secondaryOf = ownerCid;
      setTeamStatus(other, 'R');
      appendOnTag(other, team.name, kind);
    }
    const tagLabel = kind==='resource' ? 'TR' : '2nd';
    appendToLastLine(team, `${tagLabel}: ${other?other.name:''}`);
    commit(`${team.name} 2nd: ${other?other.name:''} added`);
  }
}
function secondTeamPopoverHTML(forTeamCompound){
  const {kind:ownerKind, id:forTeamId} = parseCompound(forTeamCompound);
  const team = findItem(ownerKind, forTeamId);
  const secs = team.secondaries || [];
  const isPicked = (kind,id)=> secs.some(s=>s.kind===kind && s.id===id);
  const postCols = splitByCapacity(state.posts, 2, 12).map(col=>{
    const rows = col.map(p=>{
      if(p.type==='half' || p.type==='full') return `<div class="pk-space ${p.type}"></div>`;
      const occ = teamAtPost(p.id);
      const isOwnTeam = occ && occ.id===forTeamId && occ.type===ownerKind;
      const eligible = occ && occ.type==='team' && occ.status==='P' && !occ.secondaryOf && !isOwnTeam;
      const picked = occ && isPicked('team', occ.id);
      const attr = (eligible || picked) ? `data-secpick="${forTeamCompound}" data-seckind="team" data-secid="${occ.id}"` : '';
      const dot = `<span class="pk-dot" style="background:${p.color||'#555'}"></span>`;
      const stbadge = occ && occ.status ? `<span class="stcolor" style="background:${stageColor(occ.status)};">${occ.status}</span>` : '';
      const who = occ ? `<span class="who">${occ.name}${stbadge}</span>` : '';
      const lockCls = (occ && !eligible && !picked) ? 'locked' : '';
      const boldCls = (eligible || picked) ? 'pk-eligible' : '';
      return `<div class="sp-row pk ${picked?'picked':''} ${lockCls} ${boldCls}" ${attr}>${dot}${picked?'&#10003; ':''}<span class="pn">${p.name}</span>${who}</div>`;
    }).join('');
    return `<div class="sp-col">${rows}</div>`;
  }).join('');
  const pendingHere = (k,id)=> pendingReassign && pendingReassign.kind===k && pendingReassign.id===id && pendingReassign.forTeamId===forTeamCompound;
  function unitOrResRowHTML(item, kind){
    if(item.type==='half' || item.type==='full') return `<div class="pk-space ${item.type}"></div>`;
    const picked = isPicked(kind,item.id);
    const pend = pendingHere(kind,item.id);
    const attr = `data-secpick="${forTeamCompound}" data-seckind="${kind}" data-secid="${item.id}"`;
    if(pend){ return `<div class="sp-row pk confirm-row" ${attr}>Reassign ${item.name}?</div>`; }
    const isAva = item.status==='AVA';
    const iconLabel = isAva ? 'AVA' : (kind==='unit' && item.postId ? 'P' : 'N/A');
    const icon = `<span class="sp-status-icon ${isAva?'ava':'na'}">${iconLabel}</span>`;
    return `<div class="sp-row pk ${picked?'picked':''}" ${attr}><span class="pn ${isAva?'pn-ava':''}">${item.name}</span>${icon}</div>`;
  }
  const unitColGrid = splitByCapacity(state.otherUnits, 3, 4).map(col=>
    `<div class="sp-col">${col.map(u=>unitOrResRowHTML(u,'unit')).join('')}</div>`).join('');
  const resColGrid = splitByCapacity(state.transportResources, 2, 5).map(col=>
    `<div class="sp-col">${col.map(r=>unitOrResRowHTML(r,'resource')).join('')}</div>`).join('');
  const currentAllPicks = secs.map(s=>({ s, o: findItem(s.kind, s.id) })).filter(x=>x.o);
  const currentPicksHTML = currentAllPicks.length ? `<div class="sp-current"><div class="sp-head">Currently 2nd</div><div class="sp-current-row">${currentAllPicks.map(({s,o})=>{
    const extra = s.kind==='team' ? (o.postId ? ` @ ${(postById(o.postId)||{}).name||''}` : ' (no post)') : '';
    return `<button class="sp-current-chip" data-secpick="${forTeamCompound}" data-seckind="${s.kind}" data-secid="${o.id}">${o.name}${extra}</button>`;
  }).join('')}</div></div>` : '';
  const allTeamsCol = state.teams.filter(t=>t.type==='team' && !(t.id===forTeamId && ownerKind==='team'))
    .sort((a,b)=>a.name.localeCompare(b.name, undefined, {numeric:true}))
    .map(t=>{
      const eligible = !isCallStage(t.status) && !t.secondaryOf;
      const picked = isPicked('team', t.id);
      const attr = (eligible || picked) ? `data-secpick="${forTeamCompound}" data-seckind="team" data-secid="${t.id}"` : '';
      const stbadge = t.status ? `<span class="stcolor" style="background:${stageColor(t.status)};">${t.status}</span>` : '<span class="stcolor" style="background:#555;">—</span>';
      return `<div class="sp-row pk ${picked?'picked':''} ${(!eligible && !picked)?'locked':''} ${(eligible||picked)?'pk-eligible':''}" ${attr}><span class="pn">${t.name}</span>${stbadge}</div>`;
    }).join('') || '<div class="sp-empty">none</div>';
  return `<div class="secondpop open" data-secondpop="${forTeamCompound}">
    <div class="sp-hint">Click to add/remove — stays open</div>
    ${currentPicksHTML}
    <div class="sp-cols3">
      <div class="sp-postgroup sp-postgroup-main"><div class="sp-head">Teams (by post)</div><div class="sp-postgroup-cols">${postCols}</div></div>
      <div class="sp-col"><div class="sp-head">All Teams</div>${allTeamsCol}</div>
    </div>
    <div class="sp-transport-row">
      <div class="sp-postgroup"><div class="sp-head">Other Units</div><div class="sp-postgroup-cols">${unitColGrid}</div></div>
    </div>
    <div class="sp-transport-row">
      <div class="sp-postgroup"><div class="sp-head">Transport</div><div class="sp-postgroup-cols">${resColGrid}</div></div>
    </div>
  </div>`;
}
let secNotesOpenFor = null;
function secondaryReplaceHTML(team){

  }
  const secs = team.secondaries||[];
  const armed = secondPopFor===ownCid;
  if(!secs.length){
    return `<button class="secondbtn ${armed?'active':''}" data-secondbtn="${ownCid}" title="Add 2nd team / unit">2nd</button>`;
  }
  const swappable = secs.filter(s=>s.kind==='team' || s.kind==='unit');

        const owner = !alreadyMine && item.status==='NA' ? state.teams.find(t=>Array.isArray(t.secondaries) && t.secondaries.some(s=>s.kind===kind && s.id===id)) : null;
        if(owner){
          const isPending = pendingReassign && pendingReassign.kind===kind && pendingReassign.id===id && pendingReassign.forTeamId===forTeamId;
          if(!isPending){ pendingReassign = {forTeamId, kind, id}; renderBoard(); return; }
          pendingReassign = null;

function highlightTags(safe){
  let out = safe.replace(/;(\s*(?:2nd|TR): [^;]*);/g, (m,inner)=>{
    const cls = inner.trim().startsWith('TR:') ? 'notetag-tr' : 'notetag';
    return `<span class="${cls}">;${inner};</span>`;
  });
  out = out.replace(/(2nd on: [^\n<]*|TR on: [^\n<]*)/g, (m)=>`<span class="notetag-on">${m}</span>`);
  return out;
}

function postPickerHTML(team, mode){

      const resv = state.teams.find(t=>t.type==='team' && t.nextPostId===p.id);
      const here = occ && occ.id===team.id;
      let cls, click;
      if(mode==='set'){
        if(occ && !here){ cls='taken'; click=false; }
        else { cls = occ ? 'here' : 'free'; click=true; }
      } else {
        if(resv && resv.id!==team.id){ cls='taken'; click=false; }
        else { cls = occ ? 'occ' : 'open'; click=true; }
      }
      const teamCidForAttr = team.type==='team' ? team.id : team.type+':'+team.id;
      const attr = click ? (mode==='set' ? `data-setpostpick="${p.id}" data-setpostteam="${teamCidForAttr}"` : `data-nextpick="${p.id}" data-nextteam="${team.id}"`) : '';
      const stbadge = occ && occ.status ? `<span class="stcolor" style="background:${stageColor(occ.status)};">${occ.status}</span>` : '';
      const who = occ ? `<span class="who">${occ.name}${stbadge}</span>` : '';
      const nx = resv ? `<span class="nx">+${resv.name}</span>` : '';

      const dot = `<span class="pk-dot" style="background:${p.color||'#555'}"></span>`;

      const subline = p.sub ? `<div class="pk-sub">${p.sub.replace(/</g,'&lt;')}</div>` : '';
      return `<div class="sp-row pk ${cls} ${isHere?'pk-here-highlight':''}" ${attr}>${nx}${dot}<span class="pn-wrap"><span class="pn">${p.name}</span>${subline}</span>${who}${unpostedLabel}</div>`;

function fmtElapsed(ms){
  const s = Math.floor(ms/1000);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`;
}
function isCallStage(status){ return STAGES.some(s=>s.key===status); }
function setTeamStatus(team, newStatus){
  if(team.status === newStatus) return;
  const wasCall = isCallStage(team.status);
  const willCall = isCallStage(newStatus);
  if(!wasCall && willCall){
    const pn = (team.postId ? (postById(team.postId)||{}).name : '') || '';
    const runNum = allocateRunNumber();
    team.callSession = { post: pn, startedAt: Date.now(), stages: [], runNumber: runNum };
    team.runNotes = `${runNum};`;
  }
  if(willCall && team.callSession){
    team.callSession.stages.push({ stage: newStatus, at: Date.now() });
  }
  if(wasCall && !willCall){
    if(team.callSession){
      const endedAt = Date.now();
      const secondTeamNames = (team.secondaries||[]).filter(s=>s.kind==='team'||s.kind==='unit').map(s=>{ const o=findItem(s.kind,s.id); return o?o.name:''; }).join(', ');
      state.callLog.push({
        id: crypto.randomUUID(),
        runNumber: team.callSession.runNumber,
        post: team.callSession.post, team: team.name, secondTeam: secondTeamNames,
        startedAt: team.callSession.startedAt, endedAt,
        stages: team.callSession.stages, notes: team.notes || '',
        resolution: (team.runNotes||'').split('\n').slice(1).join(' '), confirmed:false
      });
      (team.extraRuns||[]).forEach(rn=>{
        state.callLog.push({
          id: crypto.randomUUID(),
          runNumber: rn,
          post: team.callSession.post, team: team.name, secondTeam: secondTeamNames,
          startedAt: team.callSession.startedAt, endedAt,
          stages: team.callSession.stages, notes: team.notes || '',
          resolution: '', confirmed:false
        });
      });
      team.callTally = (team.callTally||0) + 1;
      team.callSession = null;
      team.notes = '';
      team.runNotes = '';
      team.extraRuns = [];
    }
  }
  if(!willCall && Array.isArray(team.secondaries) && team.secondaries.length){
    team.secondaries.forEach(s=>{
      const o = findItem(s.kind, s.id);
      if(!o) return;
      if(s.kind==='unit'){ o.status='AVA'; o.statusSince=Date.now(); }
      else if(s.kind==='team'){ o.secondaryOf=null; o.notes=''; o.status=o.postId?'P':'C'; o.statusSince=Date.now(); }
      // resource stays N/A until manually changed
    });
    team.secondaries = [];
  }
  const releasedFromDuty = (team.type==='team' && !willCall && team.secondaryOf)
    || ((team.type==='unit' || team.type==='resource') && newStatus==='AVA');
  if(releasedFromDuty){
    [...state.teams, ...state.otherUnits].forEach(t=>{
      if(!Array.isArray(t.secondaries)) return;
      const idx = t.secondaries.findIndex(s=>s.kind===team.type && s.id===team.id);
      if(idx>=0){ t.secondaries.splice(idx,1); resolveTag(t, team, team.type); }
    });
    team.secondaryOf = null;
    if(team.type==='team'){ team.notes = ''; }
    else { removeOnTag(team); }
  }
  team.status = newStatus; team.statusSince = Date.now();
}
function assignTeam(compoundId, postId){
  const {kind,id} = parseCompound(compoundId);
  const team = findItem(kind, id);
  const occupant = teamAtPost(postId);
  if(occupant && occupant.id!==team.id){ armedTeamId = null; armedPostId = null; renderBoard(); return; }
  if(kind==='team' && team.secondaryOf && postId===team.postId){
    toggleSecondary(team.secondaryOf, 'team', team.id);
    armedTeamId = null; armedPostId = null;
    return;
  }
  team.postId = postId;
  setTeamStatus(team, 'P');
  armedTeamId = null; armedPostId = null;
  commit(`${team.name} → ${postById(postId)?.name || 'post'}`);
}
function setStatus(compoundId, stageKey){
  const {kind,id} = parseCompound(compoundId);
  const team = findItem(kind, id);
  setTeamStatus(team, stageKey);
  commit(`${team.name} → ${stageKey}`);
}
function toggleDanger(compoundId){
  const {kind,id} = parseCompound(compoundId);
  const team = findItem(kind, id);
  team.danger = !team.danger;
  commit(`${team.name} ${team.danger?'flagged':'unflagged'}`);
}
function toggleClear(compoundId){
  const {kind,id} = parseCompound(compoundId);
  const team = findItem(kind, id);
  if(team.status==='C'){ setTeamStatus(team, null); commit(`${team.name} cleared status reset`); }
  else { if('postId' in team) team.postId = null; setTeamStatus(team, 'C'); commit(`${team.name} → Clear`); }
}
function toggleOOS(compoundId){
  const {kind,id} = parseCompound(compoundId);
  const team = findItem(kind, id);
  if(team.status==='OOS'){ setTeamStatus(team, null); commit(`${team.name} back in service`); }
  else { if('postId' in team) team.postId = null; setTeamStatus(team, 'OOS'); commit(`${team.name} → OOS`); }
}
function appendTag(item, field, snippet){
  const tag = `; ${snippet}; `;
  const lines = item[field] ? item[field].split('\n') : [''];
  lines[lines.length-1] = lines[lines.length-1] + tag;
  item[field] = lines.join('\n');
}
function toggleBreak(compoundId){
  const {kind,id} = parseCompound(compoundId);
  const team = findItem(kind, id);
  const t = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
  const notesField = kind==='team' ? 'teamNotes' : 'notes';
  if(team.status==='BRK'){
    setTeamStatus(team, null);
    const val = team[notesField] || '';
    const lastIdx = val.lastIndexOf('Break: ');
    if(lastIdx>=0 && !val.slice(lastIdx).includes(' to ')){
      team[notesField] = val.slice(0, lastIdx) + `Break: ${val.slice(lastIdx+7)} to ${t}`;
    } else {
      team[notesField] = val ? (val + ` Break: ${t}`) : `Break: ${t}`;
    }
    commit(`${team.name} ends break`);
  } else {
    if('postId' in team) team.postId = null;
    setTeamStatus(team, 'BRK');
    team[notesField] = team[notesField] ? (team[notesField] + ` Break: ${t}`) : `Break: ${t}`;
    commit(`${team.name} → Break`);
  }
}

function positionPopovers(){

  });
  const postsArea = document.querySelector('.posts-area');
  document.querySelectorAll('.secondpop').forEach(pop=>{

    const w = pop.offsetWidth, h = pop.offsetHeight;

    pop.style.left = Math.max(8, pr.left + (pr.width - w)/2) + 'px';
    pop.style.margin = '0';
    pop.style.right = 'auto';
    pop.style.bottom = 'auto';
  });
}

function swatchPopoverHTML(forId, kind){
  return `<div class="swatchpop" id="sw-${forId}">${SWATCHES.map(c=>
    `<span class="swatch" data-swatch="${c}" data-target="${forId}" data-kind="${kind}" style="background:${c}"></span>`).join('')}
    <span class="swatch" data-swatch="" data-target="${forId}" data-kind="${kind}" style="background:#2A2F3A"></span></div>`;
}
let moveArmedId = null; // {kind,id}
function dupTarget(kind, id){
  const arr = arrFor(kind);
  const idx = arr.findIndex(x=>x.id===id);
  const src = arr[idx];
  const copy = src.type==='post' ? { id:crypto.randomUUID(), type:'post', name:src.name, color:src.color }
    : src.type==='team' ? { id:crypto.randomUUID(), type:'team', name:src.name, color:null, postId:null, status:null, statusSince:null, danger:false, notes:'', teamNotes:'', nextPostId:null }
    : src.type==='unit' ? { id:crypto.randomUUID(), type:'unit', name:src.name, color:null, postId:null, status:null, statusSince:null, danger:false, notes:'' }
    : src.type==='resource' ? { id:crypto.randomUUID(), type:'resource', name:src.name, color:null, status:null, statusSince:null, danger:false, notes:'' }
    : { id:crypto.randomUUID(), type:src.type };
  arr.splice(idx+1, 0, copy);
  commit(`Duplicated ${src.name || (src.type+' space')}`);
}
function dlgRowHTML(item, i, total, kind){
  const dupBtn = `<button class="iconbtn" data-dup="${item.id}" data-kind="${kind}" title="Duplicate">&#8862;</button>`;
  const armed = moveArmedId && moveArmedId.kind===kind && moveArmedId.id===item.id;
  const ctl = `<div class="dlg-ctl">
    <button class="iconbtn ${armed?'move-armed':''}" data-movebtn="${item.id}" data-kind="${kind}" title="Move: click here, then click where it should go">&#8597;</button>
    ${dupBtn}
    <button class="iconbtn" data-del="${item.id}" data-kind="${kind}">&times;</button>
  </div>`;
  if(item.type==='half' || item.type==='full'){
    return `<div class="dlg-row ${item.type==='half'?'spacer-half':'spacer-full'} ${armed?'row-armed':''}" data-moveto="${item.id}" data-movetokind="${kind}">
      <div class="dlg-name"><span class="label" style="color:var(--muted);font-style:italic;">${item.type==='half'?'Half space':'Full space'}</span></div>
      ${ctl}
    </div>`;
  }
  return `<div class="dlg-row ${armed?'row-armed':''}" data-moveto="${item.id}" data-movetokind="${kind}">
    <div class="dlg-namewrap">
      <div class="dlg-name" data-dlgname="${item.id}" data-kind="${kind}">

    </div>

function renderDialogList(kind, containerId, numCols, perColCapacity){
  const arr = arrFor(kind);
  const cols = splitByCapacity(arr, numCols, perColCapacity);
  const el = document.getElementById(containerId);
  el.innerHTML = cols.map(col=>{
    const html = col.map(item=>{
      const i = arr.indexOf(item);
      return dlgRowHTML(item, i, arr.length, kind);
    }).join('');
    return `<div class="dlg-col">${html}</div>`;
  }).join('');
  el.querySelectorAll('[data-dlgsub]').forEach(inp=>{
    inp.onclick = (e)=> e.stopPropagation();
    inp.oninput = ()=>{ findItem('post', inp.dataset.dlgsub).sub = inp.value; save(); renderBoard(); };
  });
  el.querySelectorAll('[data-dup]').forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); dupTarget(b.dataset.kind, b.dataset.dup); });
  el.querySelectorAll('[data-movebtn]').forEach(b=> b.onclick=(e)=>{
    e.stopPropagation();
    const k = b.dataset.kind, id = b.dataset.movebtn;
    moveArmedId = (moveArmedId && moveArmedId.kind===k && moveArmedId.id===id) ? null : {kind:k, id};
    renderDialog();
  });
  el.querySelectorAll('[data-moveto]').forEach(row=> row.onclick=(e)=>{
    if(e.target.closest('.dlg-ctl,.swatchpop')) return;
    if(!moveArmedId) return;
    const targetKind = row.dataset.movetokind, targetId = row.dataset.moveto;
    if(targetKind!==moveArmedId.kind || targetId===moveArmedId.id) return;
    const arr = arrFor(moveArmedId.kind);
    const fromIdx = arr.findIndex(x=>x.id===moveArmedId.id);
    if(fromIdx<0) return;
    const [moved] = arr.splice(fromIdx,1);
    const toIdx = arr.findIndex(x=>x.id===targetId);
    arr.splice(toIdx<0?arr.length:toIdx, 0, moved);
    moveArmedId = null;
    commit('Reordered');
  });
  el.querySelectorAll('[data-del]').forEach(b=> b.onclick=()=>{
    if(b.dataset.confirming){
      const k = b.dataset.kind;
      if(k==='post'){
        state.teams.forEach(t=>{ if(t.postId===b.dataset.del){ t.postId=null; t.status=null; } if(t.nextPostId===b.dataset.del) t.nextPostId=null; });
        state.otherUnits.forEach(u=>{ if(u.postId===b.dataset.del){ u.postId=null; u.status=null; } });
        state.posts = state.posts.filter(p=>p.id!==b.dataset.del);
      } else {
        const arr = arrFor(k);
        const filtered = arr.filter(x=>x.id!==b.dataset.del);
        if(k==='team') state.teams = filtered;
        else if(k==='unit') state.otherUnits = filtered;
        else if(k==='resource') state.transportResources = filtered;
      }
      commit('Deleted an item');
    } else {
      b.dataset.confirming='1'; b.textContent='✓';
      setTimeout(()=>{ if(b.dataset.confirming){ delete b.dataset.confirming; b.innerHTML='&times;'; } }, 2500);
    }
  });
  el.querySelectorAll('[data-dot]').forEach(dot=>{
    dot.onclick = (e)=>{ e.stopPropagation();
      document.querySelectorAll('.swatchpop.open').forEach(s=>{ if(s.id!=='sw-'+dot.dataset.dot) s.classList.remove('open'); });
      document.getElementById('sw-'+dot.dataset.dot).classList.toggle('open');
    };
  });
  el.querySelectorAll('[data-swatch]').forEach(sw=>{
    sw.onclick = (e)=>{ e.stopPropagation();
      findItem(sw.dataset.kind, sw.dataset.target).color = sw.dataset.swatch || null;
      commit('Recolored an item');
    };
  });
  el.querySelectorAll('[data-dlgname]').forEach(nameEl=>{
    nameEl.onclick = (e)=>{
      if(e.target.closest('.dlg-dot,.swatchpop')) return;
      const labelEl = nameEl.querySelector('.label');
      if(nameEl.querySelector('input.editname')) return;
      const item = findItem(nameEl.dataset.kind, nameEl.dataset.dlgname);
      const cur = item.name;
      labelEl.outerHTML = `<input type="text" class="editname" value="${cur}">`;
      const inp = nameEl.querySelector('input.editname');
      inp.focus(); inp.select();
      inp.onclick = ev=> ev.stopPropagation();
      const finish = ()=>{ item.name = inp.value.trim() || cur; commit(`Renamed to ${item.name}`); };
      inp.onblur = finish;
      inp.onkeydown = (ev)=>{ if(ev.key==='Enter') inp.blur(); if(ev.key==='Escape'){ renderDialog(); } };
    };
  });
}

function parseHHMM(str){
  if(!str || !/^\d{3,4}$/.test(str.trim())) return null;
  const s = str.trim().padStart(4,'0');
  const h = Number(s.slice(0,2)), m = Number(s.slice(2,4));
  if(h>23||m>59) return null;
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return d;
}
function fmtCountdown(ms){
  if(ms<0) ms=0;
  const totalMin = Math.floor(ms/60000);
  const h = Math.floor(totalMin/60), m = totalMin%60;
  return h>0 ? `${h}h ${m}m` : `${m}m`;
}
function renderSetTimesHeader(){
  const el = document.getElementById('setTimesHeader');
  if(!el) return;
  const now = new Date();
  const chips = state.setTimes.filter(s=>s.name).map(stage=>{
    const slots = stage.rows
      .map(r=>({ r, start: parseHHMM(r.start), end: parseHHMM(r.end) }))
      .filter(x=>x.r.artist && x.start && x.end)
      .sort((a,b)=>a.start-b.start);
    if(!slots.length) return '';
    const current = slots.find(x=>now>=x.start && now<x.end);
    const next = slots.filter(x=>x.start>now).sort((a,b)=>a.start-b.start)[0];
    let cdHTML = '';
    if(current){ cdHTML = `<span class="cd live">ends in ${fmtCountdown(current.end-now)}</span>`; }
    else if(next){ cdHTML = `<span class="cd">next in ${fmtCountdown(next.start-now)}</span>`; }
    const rowsHTML = slots.map(x=>{
      const isCurrent = current && x===current;
      const timeStr = `${x.r.start}-${x.r.end}`;
      return `<div class="settimes-slot ${isCurrent?'live':''}">${timeStr} ${x.r.artist}${isCurrent?' (live)':''}</div>`;
    }).join('');
    return `<div class="settimes-chip"><span class="stg">${stage.name}</span>${cdHTML}${rowsHTML}</div>`;
  }).join('');
  el.innerHTML = chips;
}

function renderCallLog(){
  const body = document.getElementById('callLogBody');
  const ongoing = [];
  [...state.teams, ...state.otherUnits].filter(t=>t.callSession).forEach(t=>{
    const secondTeamNames = (t.secondaries||[]).filter(s=>s.kind==='team'||s.kind==='unit').map(s=>{ const o=findItem(s.kind,s.id); return o?o.name:''; }).join(', ');
    ongoing.push({ id:'ongoing:'+t.id, ownerCid:(t.type==='team'?t.id:t.type+':'+t.id), runNumber:t.callSession.runNumber,
      post:t.callSession.post, team:t.name, secondTeam:secondTeamNames,
      startedAt:t.callSession.startedAt, endedAt:null, stages:t.callSession.stages, notes:t.notes||'', resolution:'', ongoing:true });
    (t.extraRuns||[]).forEach(rn=>{
      ongoing.push({ id:'ongoing:'+t.id+':'+rn, ownerCid:(t.type==='team'?t.id:t.type+':'+t.id), runNumber:rn,

        startedAt:t.callSession.startedAt, endedAt:null, stages:t.callSession.stages, notes:t.notes||'', resolution:'', ongoing:true });
    });
  });
  const all = [...state.callLog, ...ongoing].sort((a,b)=>(a.runNumber||0)-(b.runNumber||0));
  if(!all.length){ body.innerHTML = '<tr><td colspan="10" style="color:var(--muted);font-style:italic;">No completed calls yet.</td></tr>'; renderConfirmedCount(); return; }
  body.innerHTML = all.map(c=>{
    const stageText = c.stages.map(s=>`${s.stage}@${new Date(s.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}`).join(', ');
    const start = new Date(c.startedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    const end = c.ongoing ? '<em>ongoing</em>' : new Date(c.endedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    if(c.ongoing){
      return `<tr class="cl-ongoing">
        <td></td>
        <td class="mono">${c.runNumber||''}</td>
        <td>${c.post||''}</td>
        <td class="mono">${c.team}</td>
        <td class="mono">${c.secondTeam||''}</td>
        <td class="mono">${start}</td>
        <td class="mono">${end}</td>
        <td>${stageText}</td>
        <td>${(c.notes||'').replace(/</g,'&lt;')}</td>
        <td><button class="calllog-del" data-endongoing="${c.ownerCid}" title="End this call now">&#9209;</button></td>
      </tr>`;
    }
    return `<tr class="${c.confirmed?'cl-confirmed':''}">
      <td><input type="checkbox" data-clconfirm="${c.id}" ${c.confirmed?'checked':''}></td>
      <td class="mono">${c.runNumber||''}</td>
      <td><div class="cl-edit" contenteditable="true" data-cledit="${c.id}" data-clfield="post">${(c.post||'').replace(/</g,'&lt;')}</div></td>
      <td><div class="cl-edit mono" contenteditable="true" data-cledit="${c.id}" data-clfield="team">${(c.team||'').replace(/</g,'&lt;')}</div></td>
      <td><div class="cl-edit mono" contenteditable="true" data-cledit="${c.id}" data-clfield="secondTeam">${(c.secondTeam||'').replace(/</g,'&lt;')}</div></td>
      <td class="mono">${start}</td>
      <td class="mono">${end}</td>
      <td>${stageText}</td>
      <td><div class="cl-edit" contenteditable="true" data-cledit="${c.id}" data-clfield="notes">${(c.notes||'').replace(/</g,'&lt;')}</div></td>
      <td><div class="cl-edit" contenteditable="true" data-cledit="${c.id}" data-clfield="resolution">${(c.resolution||'').replace(/</g,'&lt;')}</div><button class="calllog-del" data-calllogdup="${c.id}" title="Duplicate this entry">&#10697;</button><button class="calllog-del" data-calllogdel="${c.id}" title="Delete this entry">&#10005;</button></td>
    </tr>`;
  }).join('');
  body.querySelectorAll('[data-calllogdel]').forEach(b=>{
    b.onclick = ()=>{ state.callLog = state.callLog.filter(c=>c.id!==b.dataset.calllogdel); save(); renderCallLog(); };
  });
  body.querySelectorAll('[data-calllogdup]').forEach(b=>{
    b.onclick = ()=>{
      const idx = state.callLog.findIndex(c=>c.id===b.dataset.calllogdup);
      if(idx<0) return;
      const copy = JSON.parse(JSON.stringify(state.callLog[idx]));
      copy.id = crypto.randomUUID();
      copy.runNumber = allocateRunNumber();
      copy.confirmed = false;
      state.callLog.splice(idx+1, 0, copy);
      save(); renderCallLog();
    };
  });
  body.querySelectorAll('[data-clconfirm]').forEach(cb=>{
    cb.onchange = ()=>{
      const entry = state.callLog.find(c=>c.id===cb.dataset.clconfirm);
      if(entry) entry.confirmed = cb.checked;
      save(); renderCallLog();
    };
  });
  body.querySelectorAll('[data-endongoing]').forEach(b=>{
    b.onclick = ()=>{
      if(!b.dataset.confirming){
        b.dataset.confirming='1'; b.textContent='Sure?';
        setTimeout(()=>{ delete b.dataset.confirming; b.innerHTML='&#9209;'; }, 3000);
        return;
      }
      const {kind,id} = parseCompound(b.dataset.endongoing);
      const item = findItem(kind,id);
      setTeamStatus(item, kind==='team' ? 'P' : 'AVA');
      save(); renderBoard(); renderCallLog();
    };
  });
  body.querySelectorAll('[data-cledit]').forEach(inp=>{
    inp.oninput = ()=>{
      const entry = state.callLog.find(c=>c.id===inp.dataset.cledit);
      if(entry) entry[inp.dataset.clfield] = inp.textContent;
      save();
    };
  });
  renderConfirmedCount();
}
document.getElementById('callLogBtn').onclick = ()=>{ renderCallLog(); document.getElementById('callLogDialog').showModal(); };
document.getElementById('closeCallLog').onclick = ()=> document.getElementById('callLogDialog').close();
document.getElementById('callLogResetBtn').onclick = ()=>{
  const b = document.getElementById('callLogResetBtn');
  const step = Number(b.dataset.confirmStep||'0') + 1;
  if(b._clearTimer) clearTimeout(b._clearTimer);
  if(step < 4){
    b.dataset.confirmStep = String(step);
    b.textContent = step===1 ? 'Clear ALL calls?' : step===2 ? 'Are you sure?' : 'Click once more to confirm';
    b._clearTimer = setTimeout(()=>{ delete b.dataset.confirmStep; b.textContent='Clear All'; }, 4000);
    return;
  }
  delete b.dataset.confirmStep; b.textContent='Clear All';
  state.callLog = []; save(); renderCallLog();
};

function doResetStatus(){
  state.teams.forEach(t=>{
    if(t.type!=='team' || !t.postId) return;
    t.status='P'; t.statusSince=Date.now(); t.notes=''; t.callSession=null; t.secondaries=[]; t.secondaryOf=null; t.nextIsBreak=false; t.nextPostId=null; t.nextNote='';
  });
  state.otherUnits.forEach(u=>{ u.status='AVA'; u.statusSince=Date.now(); u.secondaryOf=null; });
  state.transportResources.forEach(r=>{ r.status='AVA'; r.statusSince=Date.now(); r.secondaryOf=null; });
  armedTeamId=null; armedPostId=null; armedTeamArea=null; nextPopFor=null; secondPopFor=null; notesOpenFor=null;
  commit('Reset status');
}
(function(){
  const b = document.getElementById('resetStatusBtn'); let timer = null;
  b.onclick = ()=>{
    if(!b.dataset.confirming){
      b.dataset.confirming='1'; b.textContent='Confirm?'; b.classList.add('confirming');
      timer = setTimeout(()=>{ delete b.dataset.confirming; b.textContent='Reset Status'; b.classList.remove('confirming'); }, 3500);
      return;
    }
    clearTimeout(timer); delete b.dataset.confirming; b.textContent='Reset Status'; b.classList.remove('confirming');
    doResetStatus();
  };
})();
function doResetBoard(){
  state.teams.forEach(t=>{
    if(t.type!=='team') return;
    t.postId=null; t.status=null; t.statusSince=null; t.notes=''; t.teamNotes=''; t.danger=false; t.nextPostId=null; t.callSession=null;
  });
  state.otherUnits.forEach(u=>{ u.postId=null; u.status=null; u.statusSince=null; u.notes=''; u.danger=false; });
  state.transportResources.forEach(r=>{ r.status=null; r.statusSince=null; r.notes=''; r.danger=false; });
  armedTeamId=null; armedPostId=null; armedTeamArea=null; nextPopFor=null; secondPopFor=null; notesOpenFor=null;
  commit('Reset board');
}
(function(){
  const b = document.getElementById('resetBtn'); let timer = null;
  b.onclick = ()=>{
    if(!b.dataset.confirming){
      b.dataset.confirming='1'; b.textContent='Confirm reset?'; b.classList.add('confirming');
      timer = setTimeout(()=>{ delete b.dataset.confirming; b.textContent='Reset'; b.classList.remove('confirming'); }, 3500);
      return;
    }
    clearTimeout(timer); delete b.dataset.confirming; b.textContent='Reset'; b.classList.remove('confirming');
    doResetBoard();
  };
})();

renderBoard();
renderEditsPanel();
renderRecentCallsMini();
renderSetTimesHeader();
renderConfirmedCount();
</script>
</body>
</html>
